_schema-version: "3.2"
ID: pp
version: 0.0.1
modules:
- name: pp-router
  type: approuter.nodejs
  path: router
  requires:
  - name: pp-html5-repo-runtime
  - name: pp-uaa
  - name: pp-connectivity
  - name: pp-destination-service
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  parameters:
    disk-quota: 256M
    memory: 256M
- name: pp-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: pp-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - uinotes.zip
      name: uinotes
      target-path: resources/
- name: uinotes
  type: html5
  path: ui_notes
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: SAP_ABAP_BACKEND
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      version: 1.0.0
    service: destination
    service-plan: lite
- name: pp-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: pp-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-name: pp-xsuaa-service
    service-plan: application
- name: pp-html5-repo-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: pp-connectivity
  type: org.cloudfoundry.existing-service
  parameters:
    service-name: pp-connectivity
- name: pp-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: pp-destination-service
    service-plan: lite
- name: pp-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: pp-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
